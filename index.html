<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>给你</title>
<style>
/* ============ 视觉规范 ============
   基础：设计文稿 2.9（系统字体/行高 1.9/统计每行一条……）
   用户修订 2026-08-16：
   - 白色背景版本（近白暖色底），正文深暖灰，强调金色，数字金色大字
   - 整体为「年度总结」互动式：开场信 → 统计逐屏 → 「第一次」问答流
   - 点击/滑动/键盘推进；JS 禁用时场景堆叠显示 + noscript 提示
   - 内容宽度 1080px，字号放大，撑满屏幕 */
:root{
  --bg:#12102b;
  --bg-deep:#0c0a1e;
  --ink:#f4efe6;
  --ink-soft:#b6aec8;
  --accent:#f7d794;
  --accent-2:#f0a86e;
  --bubble-me:#3f3128;
  --bubble-you:#1d1a33;
  --line:#343054;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:linear-gradient(180deg,#1a1440 0%,#12102b 45%,var(--bg-deep) 100%)}
body{
  margin:0;
  background:transparent;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:18px;
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(247,215,148,.35)}

/* ============ 年度总结场景流 ============ */
#scenes{max-width:1080px;margin:0 auto}
.scene{
  min-height:100vh;
  min-height:100svh;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;
  padding:90px 24px 130px;
  position:relative;
}
/* 流程模式（JS 启用）：一次只显示当前场景；JS 禁用时全部堆叠可见 */
.flow-mode .scene{display:none}
.flow-mode .scene.current{display:flex;animation:sceneIn .6s ease}
/* 单屏专属背景（暂未使用，保留备用） */
.scene-has-bg::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(rgba(12,10,30,.30),rgba(12,10,30,.55)),var(--scene-bg,transparent) center/cover no-repeat;
}
/* 流程期间锁定：相册与页脚在走完全部场景前不显示（类名由 JS 添加/移除） */
.flow-locked{display:none}
@keyframes sceneIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.scene-line{
  width:44px;height:1px;margin-bottom:34px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));
}
.scene-letter{margin:0;font-size:22px;letter-spacing:.02em;max-width:820px;font-weight:500}
.scene-letter + .scene-letter{margin-top:16px}
.scene-letter-date{margin-top:28px;font-size:14px;color:var(--ink-soft);letter-spacing:.3em;text-indent:.3em}

/* 统计场景：金色大数字 + 小号文字（强区分）+ 一句感慨 */
.scene-kicker{font-size:14px;letter-spacing:.34em;text-indent:.34em;color:var(--ink-soft);font-weight:500}
.scene-kicker .kicker-em{font-size:22px;font-weight:700;letter-spacing:.1em;margin-right:4px}
.scene-value{
  font-size:94px;font-weight:700;line-height:1.2;margin:18px 0 10px;
  background:linear-gradient(180deg,#f5b0a6 0%,#e08272 55%,#c05a4b 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(224,130,114,.35));
}
.scene-label{font-size:18px;color:#d3cde0;letter-spacing:.16em;text-indent:.16em;font-weight:600}
.scene-detail{margin-top:8px;font-size:14px;color:var(--ink-soft);letter-spacing:.06em}
/* 文字型数值（如「哈哈」·「自己」·「回来」）小一号，保证一行放下 */
.scene-value.words{font-size:54px;white-space:nowrap}
/* 感慨里的数字（如 13 本书）放大突出 */
.scene-stat .scene-note .note-num{
  font-size:28px;font-weight:700;margin:0 3px;
  background:linear-gradient(180deg,#f5b0a6,#c05a4b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.scene-stat .scene-note{position:relative;margin:32px auto 0;font-size:16.5px;color:var(--ink-soft);line-height:2;max-width:600px}
.scene-stat .scene-note::before{content:"";display:block;width:26px;height:1px;margin:0 auto 18px;background:linear-gradient(90deg,var(--accent-2),var(--accent));opacity:.9}

/* 问答场景：先只有问题 */
.scene-question{font-size:36px;font-weight:500;line-height:1.75;letter-spacing:.05em;max-width:780px;margin:0}

/* 答案：点击后才 reveal */
.scene-answer{display:none;margin-top:48px;width:100%;max-width:640px}
.scene-answer.revealed{display:block;animation:sceneIn .8s ease}
.scene-answer-date{font-size:14px;color:var(--ink-soft);letter-spacing:.12em}
.scene-answer-caption{margin:6px 0 22px;font-size:20px;font-weight:500}
.scene-answer .chat{text-align:left}
.scene-answer .scene-note{margin:26px auto 0;font-size:16.5px;color:var(--ink-soft);max-width:560px}
.scene-answer img{display:block;margin:0 auto;max-width:420px;width:100%;height:auto;border-radius:12px;margin-top:26px}

/* 底部提示小字（点屏幕 / 左右滑动 / 键盘） */
.scene-hint{
  position:absolute;bottom:66px;left:50%;transform:translateX(-50%);
  margin:0;font-size:14px;color:var(--ink-soft);
  letter-spacing:.26em;text-indent:.26em;white-space:nowrap;pointer-events:none;
}

/* 问答屏的揭晓按钮（渐变药丸，仅问答屏使用；揭晓后隐藏） */
.scene-btn{
  margin-top:52px;padding:13px 44px;border-radius:999px;border:none;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));
  color:#fffdf8;font-size:15px;font-weight:500;letter-spacing:.28em;text-indent:.28em;cursor:pointer;
  box-shadow:0 6px 22px rgba(201,131,50,.35), 0 2px 8px rgba(0,0,0,.12);
  transition:transform .25s,box-shadow .25s,filter .25s;
}
.scene-btn:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 12px 30px rgba(201,131,50,.42), 0 4px 12px rgba(0,0,0,.15)}
.scene-btn:active{transform:translateY(0);filter:brightness(.97)}
.scene-btn:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

/* 候选 id 徽标（挑选期参考，最终上线前移除） */
.scene-id{display:inline-block;margin-top:26px;padding:3px 14px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--ink-soft);letter-spacing:.08em}

/* ============ 心路历程（阶段页 + 合页时间轴） ============ */
.scene-timeline{justify-content:flex-start;padding-top:70px;text-align:left}
.scene-timeline .scene-kicker{text-align:center;width:100%}
/* 阶段页 */
.scene-stage{justify-content:flex-start;padding-top:56px;text-align:left}
.scene-stage .scene-kicker{text-align:center;width:100%}
.stage-kicker{font-size:18px;letter-spacing:.4em;text-indent:.4em}
.tl-stage-title{
  text-align:center;margin:6px 0 22px;
  font-family:"Kaiti SC","STKaiti","KaiTi","FangSong","STFangsong","Noto Serif SC",serif;
  font-size:42px;font-weight:700;letter-spacing:.12em;
  color:var(--phc);
  text-shadow:0 0 18px var(--phc-bg2,transparent);
}
/* 目录页：10 个阶段，点一个亮一个，全亮解锁 */
.scene-overview{justify-content:flex-start;padding-top:56px;text-align:left}
.scene-overview .scene-kicker{text-align:center;width:100%}
.ov-title{font-size:34px;margin-bottom:8px}
/* 阶段树：树根在底（初识），树冠在上（我们仨） */
.ov-tree{position:relative;width:100%;max-width:820px;height:620px;margin:8px auto 0}
.ov-tree svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov-node{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;transition:opacity .3s;
}
.ov-node.dim{opacity:.38;filter:saturate(.25)}
.ov-node .ov-dot{width:11px;height:11px;border-radius:50%}
.ov-name{
  font-family:"Kaiti SC","STKaiti","KaiTi","FangSong","STFangsong","Noto Serif SC",serif;
  font-size:21px;font-weight:700;letter-spacing:.1em;white-space:nowrap;
}
.ov-node:not(.dim) .ov-name{text-shadow:0 0 14px currentColor}
@media (max-width:760px){
  .ov-tree{height:540px}
  .ov-name{font-size:16px}
}
.scene-overview .ov-progress{
  position:absolute;top:96px;right:30px;margin:0;
  font-size:14px;font-weight:600;color:#f7d794;letter-spacing:.18em;
  text-shadow:0 0 10px rgba(247,215,148,.4);
}
@media (max-width:760px){
  .scene-overview .ov-progress{top:88px;right:16px;font-size:12px}
}
.ov-unlock{display:none;margin:14px auto 0}
.ov-unlock.show{display:block;animation:btnPulse 1.8s ease-in-out infinite}
@keyframes btnPulse{
  0%,100%{box-shadow:0 6px 22px rgba(201,131,50,.35)}
  50%{box-shadow:0 6px 34px rgba(247,215,148,.65)}
}
@media (max-width:760px){
  .ov-name{font-size:20px}
  .ov-desc{display:none}
}
.tl-stage-list{max-width:760px;margin:0 auto}
@media (max-width:760px){
  .tl-stage-title{font-size:34px}
}
.tl-list{width:100%;max-width:860px;margin:36px auto 0;position:relative}
.tl-list::before{
  content:"";position:absolute;left:50%;top:10px;bottom:10px;width:1px;margin-left:-.5px;
  background:linear-gradient(180deg,transparent,var(--accent) 6%,var(--accent-2) 94%,transparent);
  opacity:.5;
}
.tl-row{position:relative;width:50%;box-sizing:border-box;margin:12px 0;cursor:pointer}
.tl-left{margin-right:50%;padding-right:34px;text-align:right}
.tl-right{margin-left:50%;padding-left:34px;text-align:left}
.tl-dot{position:absolute;top:16px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(247,215,148,.7)}
.tl-left .tl-dot{right:-4px}
.tl-right .tl-dot{left:-4px}
.tl-content{display:inline-block;padding:8px 14px;border-radius:12px;border:1px solid var(--phc-bd,transparent);background:var(--phc-bg,rgba(247,215,148,.05));transition:background .2s}
.tl-row:hover .tl-content{background:var(--phc-bg2,rgba(247,215,148,.12))}
.tl-date{font-size:12.5px;color:var(--phc,var(--ink-soft));letter-spacing:.08em}
.tl-title{font-size:16px;font-weight:600;color:var(--phc,var(--ink));margin-top:2px}
/* 阶段配色（每过节点换色，由 --phc 驱动） */
.tl-dot{background:var(--phc,#f7d794);box-shadow:0 0 12px var(--phc,rgba(247,215,148,.95))}

/* 阶段名：写在时间轴左侧，楷体艺术字 */
.tl-stage-label{
  width:100%;text-align:left;margin:16px 0 4px;
  font-family:"Kaiti SC","STKaiti","KaiTi","FangSong","STFangsong","Noto Serif SC",serif;
  font-size:28px;font-weight:700;letter-spacing:.14em;
  color:var(--phc);
  text-shadow:0 0 14px var(--phc-bg2,transparent);
}
@media (max-width:760px){
  .tl-stage-label{margin:14px 0 4px;padding-left:24px;font-size:25px}
}

/* 重要节点 = 阶段分隔线：横线贯穿，徽章居中，颜色随阶段 */
.tl-milestone{width:100%;margin:30px 0;padding:0;text-align:center;position:relative;cursor:pointer}
.tl-milestone::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:linear-gradient(90deg,transparent,var(--phc-bd,rgba(247,215,148,.55)) 18%,var(--phc-bd,rgba(240,168,110,.55)) 82%,transparent);
}
.tl-milestone .tl-content{
  position:relative;display:inline-flex;align-items:baseline;gap:10px;
  background:#1a1533;border:1px solid var(--phc-bd,rgba(247,215,148,.5));border-radius:999px;
  padding:8px 24px;
  box-shadow:0 0 30px var(--phc-bg2,rgba(247,215,148,.18));
}
.tl-milestone .tl-icon{font-size:18px;filter:drop-shadow(0 0 8px var(--phc,rgba(247,215,148,.6)))}
.tl-milestone .tl-title{color:var(--phc,#f5b0a6);font-size:16px;font-weight:600}
.tl-milestone .tl-date{font-size:12px;color:var(--ink-soft)}
@media (max-width:760px){
  .tl-list::before{left:8px}
  .tl-left,.tl-right{width:100%;margin:10px 0;padding-left:28px;padding-right:0;text-align:left}
  .tl-left .tl-dot,.tl-right .tl-dot{left:4px;right:auto}
}

/* 详情弹层 */
.tl-overlay{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(8,7,18,.82);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.tl-overlay.open{display:flex;animation:sceneIn .3s ease}
.tl-card{
  position:relative;width:100%;max-width:920px;max-height:84vh;overflow-y:auto;
  background:#191533;border:1px solid var(--line);border-radius:16px;
  padding:30px 28px 32px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
}
.tl-close{
  position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:rgba(18,16,43,.85);color:var(--ink-soft);
  font-size:14px;cursor:pointer;
}
.tl-close:hover{color:var(--accent);border-color:var(--accent)}
.tl-card-title{margin:10px 0 20px;font-size:20px;font-weight:600}
.tl-card .scene-answer-date{margin-top:8px}
/* 左右布局：聊天（主列）+ 旁白（右侧并列） */
.tl-body{display:flex;gap:24px;align-items:flex-start}
.tl-chat{flex:1;min-width:0}
.tl-note{
  width:216px;flex:none;position:sticky;top:0;
  border-left:2px solid var(--accent);padding-left:16px;
  color:var(--ink-soft);font-size:15px;line-height:2;
}
.tl-note-label{font-size:11px;color:var(--accent);letter-spacing:.3em;text-indent:.3em;margin-bottom:8px}
.tl-note p{margin:0}
@media (max-width:760px){
  .tl-body{flex-direction:column}
  .tl-note{width:100%;position:static;border-left:none;border-top:2px solid var(--accent);padding:12px 0 0}
}

/* 页数指示（替换圆点） */
.scene-page{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:14px;color:var(--ink-soft);letter-spacing:.3em;text-indent:.3em}

/* 统计屏逐项显现动画（进场时按序淡入上移） */
.scene-stat .rv{opacity:0;animation:rvIn .7s ease forwards}
.scene-stat .rv-0{animation-delay:.1s}
.scene-stat .rv-1{animation-delay:.25s}
.scene-stat .rv-2{animation-delay:.45s}
.scene-stat .rv-3{animation-delay:.65s}
.scene-stat .rv-4{animation-delay:.85s}
@keyframes rvIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ============ 通用分节（流程之后的板块）============ */
section{max-width:1080px;margin:0 auto;padding:120px 24px 0}
.section-head{text-align:center;margin-bottom:56px}
.section-head .en{display:block;font-size:13px;letter-spacing:.44em;text-indent:.44em;color:var(--accent);text-transform:uppercase;margin-bottom:16px}
.section-head h2{margin:0;font-size:32px;font-weight:300;letter-spacing:.14em;text-indent:.14em}
.section-head::after{
  content:"";display:block;width:44px;height:1px;margin:20px auto 0;
  background:linear-gradient(90deg,var(--accent-2),var(--accent));
}

/* ---------- 气泡（微信样式：我的绿色、你的白色，各带头像） ---------- */
.chat{display:flex;flex-direction:column;gap:12px}
.chat-row{display:flex;align-items:flex-start;gap:8px}
.chat-row.me{justify-content:flex-end}
.chat-row.you{justify-content:flex-start}
.avatar{
  width:36px;height:36px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;
}
.avatar-me{background:#95ec69;color:#15230f;border:1px solid rgba(255,255,255,.25)}
.avatar-you{background:#ffffff;color:#26262b;border:1px solid rgba(255,255,255,.25)}
.avatar-img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.bubble{max-width:min(70%,560px);padding:11px 16px;border-radius:10px;font-size:17px;line-height:1.75;word-break:break-word}
.bubble.me{background:#95ec69;color:#15230f;border-top-right-radius:4px}
.bubble.you{background:#ffffff;color:#26262b;border-top-left-radius:4px}
.bubble img{max-width:100%;border-radius:8px;display:block;margin:2px 0}
.marker-chip{display:inline-block;padding:2px 10px;border-radius:8px;background:rgba(0,0,0,.06);font-size:14px;letter-spacing:.04em}

/* 时间轴详情里的旁白 */
.tl-card .scene-note{border-left:2px solid var(--accent);padding-left:12px;color:var(--ink-soft);text-align:left}

/* 开场屏的临时跳转链接 */
.jump-link{margin-top:22px;background:none;border:none;color:var(--ink-soft);font-size:14px;letter-spacing:.12em;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.jump-link:hover{color:var(--accent)}

/* ---------- 地图 ---------- */
.map-wrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#1c1836}
.map-wrap img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);text-align:center}
.pin .dot{display:block;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px rgba(247,215,148,.9);margin:0 auto}
.pin .name{display:inline-block;margin-top:7px;font-size:11.5px;color:var(--ink);background:rgba(18,16,43,.85);border:1px solid var(--line);padding:1px 8px;border-radius:9px;letter-spacing:.05em;white-space:nowrap}
.pin .date{display:block;margin-top:2px;font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em;white-space:nowrap}

/* 地图场景（序列最后一屏） */
.scene-map{justify-content:flex-start;padding-top:80px}
.scene-map .map-wrap{width:100%}

/* ---------- 相册（流程结束后直接展示） ---------- */
.gallery{columns:3;column-gap:16px}
.gallery figure{margin:0 0 16px;break-inside:avoid}
.gallery img{width:100%;height:auto;border-radius:9px;display:block;background:#1c1836}
.gallery figcaption{margin-top:8px;font-size:14px;color:var(--ink-soft);letter-spacing:.04em}
.gallery .gallery-note{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft);opacity:.85;line-height:1.8}
@media (max-width:760px){
  .gallery{columns:2}
}

/* ---------- 页脚 ---------- */
footer{padding:130px 24px 72px;text-align:center;color:var(--ink-soft);font-size:14px;letter-spacing:.14em;text-indent:.14em}

/* ---------- 静音按钮（右上） ---------- */
#mute-btn{
  position:fixed;top:16px;right:16px;z-index:10;
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:rgba(18,16,43,.85);
  color:var(--ink);font-size:15px;cursor:pointer;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}

/* ---------- 返回按钮（左上，流程第 2 屏起出现） ---------- */
.scene-back{
  position:fixed;top:16px;left:16px;z-index:10;
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:rgba(18,16,43,.85);
  color:var(--ink-soft);font-size:19px;line-height:1;cursor:pointer;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:color .25s,border-color .25s;
}
.scene-back:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- 背景照片层 ----------
   assets/img/bg.jpg（自绘卡通天空：浅蓝天空/云朵/热气球/小鸟，可随时替换）
   轻模糊 + 浅遮罩，保证卡通元素可见、文字可读。 */
.bg-photo{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(10,9,24,.18),rgba(10,9,24,.42)),url("assets/img/bg.jpg");
  background-size:cover;background-position:center;
  filter:blur(0px) brightness(1);
  transform:scale(1.02);
}

/* ---------- 滚动淡入（类名由 JS 添加；JS 禁用时一切直接可见）---------- */
.fade-in{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s ease}
.fade-in.visible{opacity:1;transform:none}

@media (max-width:760px){
  .scene-letter{font-size:19px}

<script>
"use strict";
(function () {
  function $(id) { return document.getElementById(id); }

  var MARKER_CHIP = {
    "表情": "🎭 表情",
    "图片": "🖼 图片",
    "语音": "🎤 语音",
    "视频": "🎬 视频",
    "语音通话": "📞 语音通话"
  };

  function bubble(msg) {
    var b = document.createElement("div");
    b.className = "bubble " + (msg.who === "me" ? "me" : "you");
    if (msg.img) {
      var im = document.createElement("img");
      im.src = msg.img.src || msg.img;
      im.alt = "";
      im.loading = "lazy";
      b.appendChild(im);
    }
    // 去掉导出格式的「[消息]」前缀（无含义的引用标记）
    var text = (msg.text || "").replace(/^\[消息\]\s*/, "");
    // 标记与链接类消息不再显示：整条是标记/链接就跳过，夹在文字里就剥掉
    if (/^\[(表情|图片|链接|小程序|音乐|文件)\](\s|$)/.test(text)) return null;
    if (text.includes(" | http")) return null;
    text = text.replace(/\[(表情|图片|链接|小程序|音乐|文件)\]/g, "").trim();
    // 其余纯标记消息（[语音]/[视频]/…）渲染成小图标标签
    var mk = /^\[([^\]]+)\]$/.exec(text);
    if (mk && MARKER_CHIP[mk[1]]) {
      var chip = document.createElement("span");
      chip.className = "marker-chip";
      chip.textContent = MARKER_CHIP[mk[1]];
      b.appendChild(chip);
      return b;
    }
    if (text) b.appendChild(document.createTextNode(text));
    return b;
  }

  /** 头像：有 assets/img/avatar-me.jpg / avatar-you.jpg 时用照片，否则显示「我/你」字母圆片 */
  function avatar(who) {
    var a = document.createElement("span");
    a.className = "avatar avatar-" + who;
    a.textContent = who === "me" ? "我" : "你";
    var im = new Image();
    im.src = who === "me" ? "assets/img/avatar-me.jpg" : "assets/img/avatar-you.jpg";
    im.onload = function () {
      a.textContent = "";
      im.className = "avatar-img";
      a.appendChild(im);
    };
    return a;
  }

  function chatBlock(chat) {
    var box = document.createElement("div");
    box.className = "chat";
    chat.forEach(function (m) {
      var b = bubble(m);
      if (!b) return; // 被过滤的标记消息（[表情]/[图片]）整条跳过
      var row = document.createElement("div");
      row.className = "chat-row " + (m.who === "me" ? "me" : "you");
      if (m.who === "me") { row.appendChild(b); row.appendChild(avatar("me")); }
      else { row.appendChild(avatar("you")); row.appendChild(b); }
      box.appendChild(row);
    });
    return box;
  }

  function makeHint(label) {
    var p = document.createElement("p");
    p.className = "scene-hint";
    p.textContent = label;
    return p;
  }

  function makeButton(label) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "scene-btn";
    b.textContent = label;
    return b;
  }

  /** 数字滚动计数（统计屏的大数字从 0 涨到目标值） */
  function countUp(scene) {
    var v = scene.querySelector(".scene-value[data-count]");
    if (!v) return;
    var target = +v.getAttribute("data-count");
    var suffix = v.getAttribute("data-suffix") || "";
    var dur = 1300, start = null;
    function step(t) {
      if (start === null) start = t;
      var p = Math.min(1, (t - start) / dur);
      var eased = 1 - Math.pow(1 - p, 3);
      var n = Math.round(target * eased);
      v.textContent = n.toLocaleString("en-US") + suffix;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function addPage(scene) {
    var p = document.createElement("div");
    p.className = "scene-page";
    scene.appendChild(p);
  }

  function setPage(scene, current, total) {
    var p = scene.querySelector(".scene-page");
    if (p) {
      p.textContent = String(current + 1).padStart(2, "0");
    }
  }

  /** 年度总结场景流：开场信 → 统计逐屏 → 「第一次」问答。
      每个问答场景先只显示问题，点击后才 reveal 答案；揭晓完才推进到下一个。
      JS 禁用时本函数不运行，所有场景内容堆叠可见（降级）。 */
  function renderScenes(container) {
    var scenes = [];
    var combinedIdx = -1;
    var overviewIdx = -1;
    var stageVisited = [];
    var stageScenes = [];
    // 静态场景（地图，places.inc.html 提供）先收集，之后挪到序列末尾
    var staticScenes = Array.prototype.slice.call(container.querySelectorAll(".scene"));

    // —— 开场信 ——
    var intro = document.createElement("section");
    intro.className = "scene scene-intro";
    var line = document.createElement("div");
    line.className = "scene-line";
    // 首屏信按空行分段（文言文四段式）
    intro.appendChild(line);
    (LETTER || "").split(/\n+/).filter(Boolean).forEach(function (para) {
      var lp = document.createElement("p");
      lp.className = "scene-letter";
      lp.textContent = para;
      intro.appendChild(lp);
    });
    var letterDate = document.createElement("div");
    letterDate.className = "scene-letter-date";
    letterDate.textContent = "2021.12.10 — 2026.08.16";
    intro.appendChild(letterDate);
    var startBtn = makeButton("开 始");
    startBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      advance();
    });
    intro.appendChild(startBtn);
    var introHint = makeHint("点一下 · 或左右滑动");
    intro.appendChild(introHint);
    container.appendChild(intro);
    scenes.push({ el: intro, hint: introHint });

    // —— 统计逐屏 ——
    (STATS || []).forEach(function (st, stIdx) {
      var sec = document.createElement("section");
      sec.className = "scene scene-stat";
      // 只给最前面几个统计屏做逐项显现 + 数字滚动动画，后面的直接显示
      var animated = stIdx < 6;
      // 眉题：「我们聊了这些」，「我们」稍大（颜色不变）
      var kicker = document.createElement("div");
      kicker.className = "scene-kicker" + (animated ? " rv rv-0" : "");
      var kem = document.createElement("span");
      kem.className = "kicker-em";
      kem.textContent = "我们";
      kicker.appendChild(kem);
      kicker.appendChild(document.createTextNode("聊了这些"));
      var value = document.createElement("div");
      value.className = "scene-value" + (st.value.indexOf("「") >= 0 ? " words" : "") + (animated ? " rv rv-1" : "");
      // 纯数字值：先显示 0，进场时滚动计数；文字型值：直接显示（只做淡入）
      var numMatch = /^([\d,]+)(.*)$/.exec(st.value);
      if (animated && numMatch) {
        value.setAttribute("data-count", numMatch[1].replace(/,/g, ""));
        value.setAttribute("data-suffix", numMatch[2]);
        value.textContent = "0" + numMatch[2];
      } else {
        value.textContent = st.value;
      }
      var label = document.createElement("div");
      label.className = "scene-label" + (animated ? " rv rv-2" : "");
      label.textContent = st.label;
      sec.appendChild(kicker);
      sec.appendChild(value);
      sec.appendChild(label);
      if (st.note) {
        var note = document.createElement("p");
        note.className = "scene-note" + (animated ? " rv rv-4" : "");
        // 感慨里的数字单独放大突出（如「13 本书」）
        st.note.split(/(\d[\d,]*)/g).forEach(function (part) {
          if (/^\d[\d,]*$/.test(part)) {
            var b = document.createElement("span");
            b.className = "note-num";
            b.textContent = part;
            note.appendChild(b);
          } else if (part) {
            note.appendChild(document.createTextNode(part));
          }
        });
        sec.appendChild(note);
      }
      if (st.detail) {
        var detail = document.createElement("div");
        detail.className = "scene-detail" + (animated ? " rv rv-3" : "");
        detail.textContent = st.detail;
        sec.appendChild(detail);
      }
      var hint = makeHint("左右滑动，继续");
      sec.appendChild(hint);
      container.appendChild(sec);
      scenes.push({ el: sec, hint: hint });
    });

    // —— 第一次问答 ——
    (FIRSTS || []).forEach(function (f) {
      var sec = document.createElement("section");
      sec.className = "scene scene-q";
      var q = document.createElement("p");
      q.className = "scene-question";
      q.textContent = f.question;
      sec.appendChild(q);

      var ans = document.createElement("div");
      ans.className = "scene-answer";
      if (f.date) {
        var d = document.createElement("div");
        d.className = "scene-answer-date";
        d.textContent = f.date;
        ans.appendChild(d);
      }
      if (f.caption) {
        var c = document.createElement("p");
        c.className = "scene-answer-caption";
        c.textContent = f.caption;
        ans.appendChild(c);
      }
      if (f.chat && f.chat.length) ans.appendChild(chatBlock(f.chat));
      if (f.photos && f.photos.length) {
        f.photos.forEach(function (p) {
          var im = document.createElement("img");
          im.src = p.src; im.width = p.w; im.height = p.h; im.alt = p.alt || "";
          im.loading = "lazy";
          ans.appendChild(im);
        });
      }
      if (f.note) {
        var n = document.createElement("p");
        n.className = "scene-note";
        n.textContent = f.note;
        ans.appendChild(n);
      }
      sec.appendChild(ans);

      var hint = makeHint("左右滑动，继续");
      hint.hidden = true; // 揭晓后出现
      var btn = makeButton("点一下，揭晓答案");
      sec.appendChild(hint);
      sec.appendChild(btn);
      container.appendChild(sec);
      scenes.push({ el: sec, hint: hint, btn: btn, ans: ans, revealed: false });
    });

    // —— 心路历程：按 10 个阶段拆成 10 页，最后一张是完整合页 ——
    var MS_DATES = (typeof MILESTONES !== "undefined" ? MILESTONES : []).map(function (m) { return m.date; }).sort();
    var PALETTE = ["#7fc4e8", "#6fd6c3", "#8fd97f", "#c4d96f", "#e3d05f", "#f0b95c", "#f29a5c", "#f27d6f", "#ef6a8a", "#b79ae8"];
    var STAGE_NAMES = ["初识", "心动", "靠近", "热恋", "陪伴", "安家", "备婚", "婚事", "新婚", "我们仨"];
    var STAGE_DESC = [
      "认识的第一年，我们还在互相试探。消息一条一条，越聊越多，谁也没提停。",
      "见过面之后，一切都变了。原来屏幕里的人，笑起来是这个样子。",
      "那个夏天之后，我们之间不再需要试探。有些话，开始敢说了。",
      "正式在一起的第一年。异地、飞来飞去，每一次见面都像过节。",
      "在一起久了，热烈变成了习惯。我们开始像家人一样惦记彼此。",
      "看房、买房、装修。我们开始为「以后」做打算，一步一步把家拼出来。",
      "订婚之后，生活里全是婚礼的清单。忙着忙着，也有点甜。",
      "你答应我的那天，我高兴了很久。接下来的一切，都在朝着同一个方向走。",
      "领了证，办了婚礼。我们从此是合法的两个人。",
      "结婚之后，家里多了一个还没出生的人。我们开始练习当爸爸妈妈。"
    ];
    function rgba(hex, a) {
      var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return "rgba(" + r + "," + g + "," + b + "," + a + ")";
    }
    function paintEl(el, d) {
      var seg = segOf(d);
      var c = PALETTE[seg % PALETTE.length];
      el.style.setProperty("--phc", c);
      el.style.setProperty("--phc-bg", rgba(c, .16));
      el.style.setProperty("--phc-bg2", rgba(c, .28));
      el.style.setProperty("--phc-bd", rgba(c, .55));
    }
    function segOf(d) {
      var seg = 0;
      for (var k = 0; k < MS_DATES.length; k++) { if (d >= MS_DATES[k]) seg = k + 1; }
      return Math.min(seg, 9);
    }
    // 合并排序：高光 + 重要节点（同日节点在前），高光编号全局连续
    var entries = [];
    (HIGHLIGHTS || []).forEach(function (hl) { entries.push({ t: "hl", hl: hl }); });
    (typeof MILESTONES !== "undefined" ? MILESTONES : []).forEach(function (ms) { entries.push({ t: "ms", ms: ms }); });
    entries.sort(function (x, y) {
      var dx = x.t === "hl" ? x.hl.date : x.ms.date;
      var dy = y.t === "hl" ? y.hl.date : y.ms.date;
      if (dx < dy) return -1;
      if (dx > dy) return 1;
      return x.t === "ms" ? -1 : 1;
    });
    var hlNum = 0;
    entries.forEach(function (e) {
      if (e.t === "hl") { e.num = ++hlNum; }
      e.seg = e.t === "hl" ? segOf(e.hl.date) : segOf(e.ms.date);
    });

    function buildMilestoneRow(e) {
      var mrow = document.createElement("div");
      mrow.className = "tl-milestone";
      paintEl(mrow, e.ms.date);
      var mc = document.createElement("div");
      mc.className = "tl-content";
      var icon = document.createElement("span");
      icon.className = "tl-icon";
      icon.textContent = e.ms.icon || "★";
      var mt = document.createElement("span");
      mt.className = "tl-title";
      mt.textContent = e.ms.label;
      var md2 = document.createElement("span");
      md2.className = "tl-date";
      md2.textContent = e.ms.date;
      mc.appendChild(icon); mc.appendChild(mt); mc.appendChild(md2);
      mrow.appendChild(mc);
      mrow.addEventListener("click", function (e2) {
        e2.stopPropagation();
        openTimelineDetail({ date: e.ms.date, title: e.ms.label, messages: e.ms.chat || [], note: e.ms.note || "" });
      });
      return mrow;
    }

    function buildHlRow(e) {
      var hl = e.hl;
      var whoSet = {};
      (hl.messages || []).forEach(function (m) { whoSet[m.who] = 1; });
      var side;
      if (whoSet.me && whoSet.you) side = Math.random() < 0.5 ? "tl-left" : "tl-right";
      else if (whoSet.me) side = "tl-right";
      else side = "tl-left";
      var row = document.createElement("div");
      row.className = "tl-row " + side;
      paintEl(row, hl.date);
      var dot = document.createElement("span");
      dot.className = "tl-dot";
      var meta = document.createElement("div");
      meta.className = "tl-content";
      var d = document.createElement("div");
      d.className = "tl-date";
      d.textContent = hl.date;
      var t = document.createElement("div");
      t.className = "tl-title";
      t.textContent = e.num + ". " + hl.title;
      meta.appendChild(d); meta.appendChild(t);
      row.appendChild(dot); row.appendChild(meta);
      row.addEventListener("click", function (e2) {
        e2.stopPropagation();
        openTimelineDetail(hl);
      });
      return row;
    }

    // —— 目录页：10 个阶段，点进去看完返回，点一个亮一个；全亮后解锁完整时间轴 ——
    function allStageVisited() {
      for (var s = 0; s < 10; s++) { if (!stageVisited[s]) return false; }
      return true;
    }
    function refreshOverview() {
      if (overviewIdx < 0) return;
      var ov = scenes[overviewIdx].el;
      var items = ov.querySelectorAll(".ov-item");
      for (var s = 0; s < items.length; s++) {
        var sg = parseInt(items[s].getAttribute("data-seg"), 10);
        items[s].classList.toggle("dim", !stageVisited[sg]);
      }
      var prog = ov.querySelector(".ov-progress");
      if (prog) {
        var n = 0;
        for (var s2 = 0; s2 < 10; s2++) { if (stageVisited[s2]) n++; }
        prog.textContent = "已点亮 " + n + " / 10";
      }
      var un = ov.querySelector(".ov-unlock");
      if (un) un.classList.toggle("show", allStageVisited());
    }
    (function () {
      var sec = document.createElement("section");
      sec.className = "scene scene-overview";
      var kicker = document.createElement("div");
      kicker.className = "scene-kicker stage-kicker";
      kicker.textContent = "心路历程";
      sec.appendChild(kicker);
      var ttl = document.createElement("div");
      ttl.className = "tl-stage-title ov-title";
      ttl.textContent = "· 目录";
      ttl.style.setProperty("--phc", PALETTE[0]);
      sec.appendChild(ttl);
      // 10 个阶段画成一棵树：树根在底（初识），树冠在上（我们仨）
      var TREE_NODES = [
        { seg: 9, x: 22, y: 10 }, { seg: 8, x: 78, y: 10 },
        { seg: 7, x: 18, y: 24 }, { seg: 6, x: 82, y: 24 },
        { seg: 5, x: 15, y: 38 }, { seg: 4, x: 85, y: 38 },
        { seg: 3, x: 18, y: 52 }, { seg: 2, x: 82, y: 52 },
        { seg: 1, x: 22, y: 66 }, { seg: 0, x: 78, y: 66 }
      ];
      var treeW = 820, treeH = 620;
      function tx(p) { return treeW * p / 100; }
      function ty(p) { return treeH * p / 100; }
      var svg = "";
      // 树干（从底部到树冠）
      svg += '<path d="M ' + (tx(49)) + ' ' + ty(96) + ' L ' + (tx(51)) + ' ' + ty(96) + ' L ' + (tx(51.6)) + ' ' + ty(14) + ' L ' + (tx(48.4)) + ' ' + ty(14) + ' Z" fill="#5b4331"/>';
      svg += '<ellipse cx="' + tx(50) + '" cy="' + ty(96) + '" rx="26" ry="8" fill="#4a3526"/>';
      // 树枝：从树干分叉到每个节点
      var trunkY = { 9: 16, 8: 16, 7: 28, 6: 28, 5: 40, 4: 40, 3: 52, 2: 52, 1: 64, 0: 64 };
      for (var bi = 0; bi < TREE_NODES.length; bi++) {
        var nd = TREE_NODES[bi];
        var nx = tx(nd.x), ny = ty(nd.y);
        var sx = tx(50), sy = ty(trunkY[nd.seg]);
        var cx = sx + (nx - sx) * 0.45, cy = sy + (ny - sy) * 0.5;
        svg += '<path d="M ' + sx + ' ' + sy + ' Q ' + cx + ' ' + cy + ' ' + nx + ' ' + ny + '" fill="none" stroke="#5b4331" stroke-width="3" stroke-linecap="round"/>';
        // 叶子光晕
        svg += '<circle cx="' + nx + '" cy="' + ny + '" r="15" fill="' + PALETTE[nd.seg] + '" opacity="0.16"/>';
      }
      var treeBox = document.createElement("div");
      treeBox.className = "ov-tree";
      treeBox.innerHTML = '<svg viewBox="0 0 ' + treeW + ' ' + treeH + '" preserveAspectRatio="xMidYMid meet">' + svg + "</svg>";
      TREE_NODES.forEach(function (nd) {
        (function (seg) {
          var item = document.createElement("div");
          item.className = "ov-item ov-node dim";
          item.setAttribute("data-seg", String(seg));
          item.style.left = nd.x + "%";
          item.style.top = nd.y + "%";
          var dot = document.createElement("span");
          dot.className = "ov-dot";
          dot.style.background = PALETTE[seg];
          dot.style.boxShadow = "0 0 12px " + PALETTE[seg];
          var nm = document.createElement("span");
          nm.className = "ov-name";
          nm.textContent = STAGE_NAMES[seg];
          nm.style.color = PALETTE[seg];
          item.appendChild(dot); item.appendChild(nm);
          item.addEventListener("click", function (e2) {
            e2.stopPropagation();
            stageVisited[seg] = true;
            refreshOverview();
            show(stageScenes[seg]);
          });
          treeBox.appendChild(item);
        })(nd.seg);
      });
      sec.appendChild(treeBox);
      var prog = document.createElement("div");
      prog.className = "ov-progress";
      prog.textContent = "已点亮 0 / 10";
      sec.appendChild(prog);
      var un = makeButton("全部点亮 · 展开完整时间轴");
      un.classList.add("ov-unlock");
      un.addEventListener("click", function (e2) {
        e2.stopPropagation();
        show(combinedIdx);
      });
      sec.appendChild(un);
      var hint = makeHint("点开一个阶段，看完返回");
      sec.appendChild(hint);
      container.appendChild(sec);
      scenes.push({ el: sec, hint: hint, noTap: true });
      overviewIdx = scenes.length - 1;
    })();

    // —— 10 个阶段页 ——
    for (var segIdx = 0; segIdx < 10; segIdx++) {
      (function (seg) {
        var sec = document.createElement("section");
        sec.className = "scene scene-stage";
        var kicker = document.createElement("div");
        kicker.className = "scene-kicker stage-kicker";
        kicker.textContent = "心路历程";
        var name = document.createElement("div");
        name.className = "tl-stage-title";
        name.textContent = "· " + STAGE_NAMES[seg];
        name.style.setProperty("--phc", PALETTE[seg % PALETTE.length]);
        var desc = document.createElement("p");
        desc.className = "tl-stage-desc";
        desc.textContent = STAGE_DESC[seg] || "";
        sec.appendChild(kicker);
        sec.appendChild(name);
        sec.appendChild(desc);
        var list = document.createElement("div");
        list.className = "tl-list tl-stage-list";
        var g = entries.filter(function (e) { return e.seg === seg; });
        g.forEach(function (e) {
          if (e.t === "ms") list.appendChild(buildMilestoneRow(e));
          else list.appendChild(buildHlRow(e));
        });
        sec.appendChild(list);
        var hint = makeHint("左右滑动，继续");
        sec.appendChild(hint);
        container.appendChild(sec);
        scenes.push({ el: sec, hint: hint, noTap: true, stage: true });
        stageScenes[segIdx] = scenes.length - 1;
      })(segIdx);
    }

    // —— 合页：完整时间轴（首页快捷链接跳到这里） ——
    (function () {
      var sec = document.createElement("section");
      sec.className = "scene scene-timeline";
      var kicker = document.createElement("div");
      kicker.className = "scene-kicker stage-kicker";
      kicker.textContent = "心路历程 · 全记录";
      sec.appendChild(kicker);
      var list = document.createElement("div");
      list.className = "tl-list";
      var curSeg = -1;
      function appendStageName(seg) {
        curSeg = seg;
        var lab = document.createElement("div");
        lab.className = "tl-stage-label";
        lab.textContent = "· " + STAGE_NAMES[seg];
        lab.style.setProperty("--phc", PALETTE[seg % PALETTE.length]);
        list.appendChild(lab);
      }
      entries.forEach(function (e) {
        if (e.t === "ms") {
          // 节点分隔线在前，阶段名紧跟其后
          list.appendChild(buildMilestoneRow(e));
          if (e.seg !== curSeg) appendStageName(e.seg);
          return;
        }
        if (e.seg !== curSeg) appendStageName(e.seg);
        list.appendChild(buildHlRow(e));
      });
      sec.appendChild(list);
      var btn = makeButton("继续");
      btn.addEventListener("click", function (e) { e.stopPropagation(); advance(); });
      sec.appendChild(btn);
      var hint = makeHint("左右滑动，继续");
      sec.appendChild(hint);
      container.appendChild(sec);
      scenes.push({ el: sec, hint: hint, noTap: true });
      combinedIdx = scenes.length - 1;
    })();

    // —— 结束语 ——
    (function () {
      var sec = document.createElement("section");
      sec.className = "scene scene-ending";
      var line2 = document.createElement("div");
      line2.className = "scene-line";
      var t2 = document.createElement("p");
      t2.className = "scene-letter";
      t2.textContent = (typeof ENDING !== "undefined" && ENDING) ? ENDING : "";
      var d2 = document.createElement("div");
      d2.className = "scene-letter-date";
      d2.textContent = "2021.12.10 — 2026.08.16";
      sec.appendChild(line2);
      sec.appendChild(t2);
      sec.appendChild(d2);
      var hint2 = makeHint("左右滑动，继续");
      sec.appendChild(hint2);
      container.appendChild(sec);
      scenes.push({ el: sec, hint: hint2 });
    })();


    // —— 静态场景（地图）挪到序列末尾，DOM 顺序与展示顺序一致 ——
    staticScenes.forEach(function (sec) {
      var hint = sec.querySelector(".scene-hint");
      container.appendChild(sec);
      scenes.push({ el: sec, hint: hint });
    });

    if (!scenes.length) return;
    container.classList.add("flow-mode");
    scenes.forEach(function (s) { addPage(s.el); });

    // 流程期间锁定：页脚不显示，走完全部场景才解锁
    var footerEl = document.querySelector("footer");
    if (footerEl) footerEl.classList.add("flow-locked");

    // 返回按钮：第 2 屏起出现在左上角
    var backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.className = "scene-back";
    backBtn.setAttribute("aria-label", "上一屏");
    backBtn.textContent = "‹";
    backBtn.hidden = true;
    document.body.appendChild(backBtn);

    var current = 0;
    function show(i) {
      current = Math.max(0, Math.min(scenes.length - 1, i));
      scenes.forEach(function (s, k) {
        s.el.classList.toggle("current", k === current);
        setPage(s.el, current, scenes.length);
      });
      var cur = scenes[current];
      if (cur.el.classList.contains("scene-stat")) countUp(cur.el);
      backBtn.hidden = current === 0;
      window.scrollTo(0, 0); // 换页时回到顶部，避免沿用上一页的滚动位置
    }

    function advance() {
      if (!container.classList.contains("flow-mode")) return;
      var sc = scenes[current];
      if (sc.stage) return; // 阶段页只能返回，不能前进
      // 问答场景：先揭晓答案，再允许推进
      if (sc.ans && !sc.revealed) {
        sc.revealed = true;
        sc.ans.classList.add("revealed");
        if (sc.btn) sc.btn.hidden = true;
        if (sc.hint) sc.hint.hidden = false;
        return;
      }
      // 线性推进跳过阶段页（阶段页只能从目录点进去）
      var nextIdx = current + 1;
      while (nextIdx < scenes.length && scenes[nextIdx].stage) nextIdx++;
      // 合页未解锁时（阶段没全点亮），前进到合页会被送回目录页
      if (nextIdx === combinedIdx && !allStageVisited()) { show(overviewIdx); return; }
      if (current >= scenes.length - 1) {
        // 流程结束：解除 flow-mode，全部场景可自由滚动回看，解锁页脚
        container.classList.remove("flow-mode");
        scenes.forEach(function (x) { if (x.hint) x.hint.hidden = true; });
        backBtn.hidden = true;
        if (footerEl) footerEl.classList.remove("flow-locked");
        return;
      }
      show(nextIdx);
    }

    function goBack() {
      if (current <= 0) return;
      var prevIdx = current - 1;
      while (prevIdx > 0 && scenes[prevIdx].stage) prevIdx--;
      show(prevIdx);
    }

    scenes.forEach(function (s) {
      if (!s.noTap) s.el.addEventListener("click", advance); // 点屏幕任意处推进（时间轴屏除外）
      if (s.btn) s.btn.addEventListener("click", function (e) {
        e.stopPropagation(); // 防止冒泡到场景点击导致连翻
        advance();
      });
    });
    backBtn.addEventListener("click", goBack);
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { goBack(); }
      else if (e.key === "ArrowRight") { advance(); }
    });

    // —— 手势：触控板双指左右滑动 / 触摸屏横向滑动 ——
    // 左滑 = 下一屏，右滑 = 上一屏；纵向滚动不拦截；冷却 500ms 防止一次手势连翻多屏
    var swipeCooldown = 0;
    var wheelAcc = 0;
    window.addEventListener("wheel", function (e) {
      if (!container.classList.contains("flow-mode")) return;
      if (Date.now() < swipeCooldown) { wheelAcc = 0; return; }
      var dx = e.deltaX, dy = e.deltaY;
      if (Math.abs(dx) < Math.abs(dy) * 1.5) { wheelAcc = 0; return; } // 垂直滚动为主时不拦截
      if (Math.abs(dx) < 4) return;
      if (wheelAcc !== 0 && dx * wheelAcc < 0) wheelAcc = 0; // 换向重新累计
      wheelAcc += dx;
      if (Math.abs(wheelAcc) > 60) {
        swipeCooldown = Date.now() + 500;
        wheelAcc = 0;
        if (dx > 0) advance(); else goBack();
      }
    }, { passive: true });

    var tx = 0, ty = 0, tracking = false;
    window.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      tx = e.touches[0].clientX;
      ty = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });
    window.addEventListener("touchmove", function (e) {
      if (!tracking || !container.classList.contains("flow-mode")) return;
      if (Date.now() < swipeCooldown) { tracking = false; return; }
      var dx = e.touches[0].clientX - tx;
      var dy = e.touches[0].clientY - ty;
      if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx) * 1.5) { tracking = false; return; } // 纵向滑动
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        tracking = false;
        swipeCooldown = Date.now() + 500;
        if (dx < 0) advance(); else goBack();
      }
    }, { passive: true });
    window.addEventListener("touchend", function () { tracking = false; }, { passive: true });

    // 开发辅助：URL 带 #scene=N 直接跳到第 N 屏（截图/逐屏检查用，从 1 开始计）
    var hashJump = 0;
    var hm = /^#scene=(\d+)$/.exec(location.hash);
    if (hm) hashJump = Math.min(Math.max(parseInt(hm[1], 10) - 1, 0), scenes.length - 1);
    show(hashJump);
  }

  /** 相册。必须写入 w/h 属性防跳动；loading="lazy"。 */
  function renderGallery(photos, container) {
    photos.forEach(function (p) {
      var fig = document.createElement("figure");
      var im = document.createElement("img");
      im.src = p.src; im.width = p.w; im.height = p.h; im.alt = p.alt || "";
      im.loading = "lazy";
      fig.appendChild(im);
      if (p.alt) {
        var cap = document.createElement("figcaption");
        cap.textContent = p.alt;
        fig.appendChild(cap);
      }
      if (p.note) {
        var pn = document.createElement("p");
        pn.className = "gallery-note";
        pn.textContent = p.note;
        fig.appendChild(pn);
      }
      container.appendChild(fig);
    });
    observeFadeIn(container.querySelectorAll("figure"));
  }

  /** 滚动淡入。IntersectionObserver 不可用时全部直接设为可见。 */
  function observeFadeIn(nodes) {
    nodes = Array.prototype.slice.call(nodes || []);
    if (!nodes.length) return;
    if (!("IntersectionObserver" in window)) {
      nodes.forEach(function (n) { n.classList.add("visible"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("visible"); io.unobserve(en.target); }
      });
    }, { threshold: 0.08 });
    nodes.forEach(function (n) { n.classList.add("fade-in"); io.observe(n); });
  }

  /** 时间轴详情弹层：点条目后全屏浮层展示该段聊天原文，✕ 或点空白处关闭 */
  function openTimelineDetail(hl) {
    var ov = document.getElementById("tl-overlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "tl-overlay";
      ov.className = "tl-overlay";
      document.body.appendChild(ov);
      ov.addEventListener("click", function () { ov.classList.remove("open"); });
    }
    ov.innerHTML = "";
    var card = document.createElement("div");
    card.className = "tl-card";
    card.addEventListener("click", function (e) { e.stopPropagation(); });
    var close = document.createElement("button");
    close.type = "button";
    close.className = "tl-close";
    close.textContent = "✕";
    close.addEventListener("click", function () { ov.classList.remove("open"); });
    var date = document.createElement("div");
    date.className = "scene-answer-date";
    date.textContent = hl.date;
    var title = document.createElement("h4");
    title.className = "tl-card-title";
    title.textContent = hl.title;
    card.appendChild(close); card.appendChild(date); card.appendChild(title);
    // 左右布局：聊天为主列，旁白在右侧并列（边看聊天边看旁白）
    var body = document.createElement("div");
    body.className = "tl-body";
    var chatWrap = document.createElement("div");
    chatWrap.className = "tl-chat";
    if (hl.messages && hl.messages.length) chatWrap.appendChild(chatBlock(hl.messages));
    body.appendChild(chatWrap);
    if (hl.note) {
      var aside = document.createElement("aside");
      aside.className = "tl-note";
      var nl = document.createElement("div");
      nl.className = "tl-note-label";
      nl.textContent = "旁白";
      var np = document.createElement("p");
      np.textContent = hl.note;
      aside.appendChild(nl); aside.appendChild(np);
      body.appendChild(aside);
    }
    card.appendChild(body);
    ov.appendChild(card);
    ov.classList.add("open");
  }

  /** 音频：先试自动播，失败则 click/touchstart/scroll 任一解锁。
      全程静默——不显示报错，不显示卡住的播放器。 */
  function setupAudio(audio) {
    var btn = $("mute-btn");
    function onPlay() {
      if (btn) { btn.hidden = false; btn.textContent = "♪"; }
    }
    function tryPlay() {
      audio.play().then(onPlay).catch(function () { /* 静默 */ });
    }
    audio.addEventListener("error", function () { /* 静默：文件缺失或解码失败都不打扰 */ });
    tryPlay();
    ["click", "touchstart", "scroll"].forEach(function (ev) {
      window.addEventListener(ev, function unlock() {
        if (audio.paused) tryPlay();
        window.removeEventListener(ev, unlock);
      }, { passive: true });
    });
    if (btn) btn.addEventListener("click", function () {
      if (audio.paused) { tryPlay(); } else { audio.pause(); btn.textContent = "✕"; }
    });
  }

  /* —— 调用处：每块独立 try/catch，单块失败不影响其余板块 —— */
  function dispatch(id) {
    var container = $(id);
    if (!container) { console.warn(id + " 容器不存在"); return; }
    if (id === "scenes") renderScenes(container);
    if (!container.childElementCount) {
      var sec = container.closest ? container.closest("section") : null;
      if (sec) sec.hidden = true; // 空板块整段隐藏，不留残缺痕迹
    }
  }
  ["scenes"].forEach(function (id) {
    try { dispatch(id); } catch (e) { console.warn(id, e); }
  });

  var audio = $("bgm");
  if (audio) { try { setupAudio(audio); } catch (e) { console.warn("audio", e); } }
})();
</script>

<footer>给你 · 2021.12 — 2026.08</footer>
